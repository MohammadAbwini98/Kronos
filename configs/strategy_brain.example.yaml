strategy_brain:
  enabled: false
  dry_run: true
  symbol: GOLD
  main_timeframe: "5m"

  timeframes:
    execution: "5m"
    higher_timeframes:
      - "15m"
      - "30m"
      - "1h"

  scoring:
    min_strategy_score: 75
    min_final_score: 75
    conservative_final_score: 82
    ai_soft_veto_threshold: -60

  strategy_thresholds:
    trend_min_score: 75
    breakout_min_score: 85
    breakout_priority_score: 90
    mean_reversion_min_score: 75
    final_min_score: 75

  hard_blocks:
    max_spread_absolute: 3.0
    max_spread_atr: 0.15
    min_expected_move_spread_mult: 2.0
    block_garch_extreme: true
    require_regime_persistence: true

  spread_limits:
    max_spread_absolute: 3.0
    max_spread_atr: 0.15

  indicators:
    ema_fast: 20
    ema_mid: 50
    ema_slow: 200
    atr_period: 14
    rsi_period: 14
    adx_period: 14
    bb_period: 20
    bb_std: 2.0
    donchian_period: 20
    swing_len: 2

  regimes:
    persistence_k: 2
    persistence_m: 3
    trend_adx_min: 18
    range_adx_max: 18
    atr_extreme_percentile: 95

  risk:
    risk_per_trade: 0.005
    conservative_risk_per_trade: 0.0025
    max_risk_per_trade: 0.01
    max_daily_loss: 0.02
    max_consecutive_losses: 3
    loss_cooldown_minutes: 120
    signal_cooldown_minutes: 15
    max_open_positions_per_symbol: 1
    partial_close_tp1: 0.60
    runner_close_tp2: 0.40

  ai_support:
    enabled: false
    ai_cannot_generate_signal: true
    missing_model_support_value: 0.0
    weights:
      kronos: 35.0
      chronos2: 15.0
      timesfm: 15.0
      local_models: 15.0
      moirai: 10.0
      garch: 10.0

  dashboard:
    enabled: true
    history_limit_default: 50
